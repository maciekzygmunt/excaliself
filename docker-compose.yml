version: '3.8'

services:
  excalidraw:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BASE_URL=${BASE_URL:-http://localhost:3000}
      - DATABASE_PATH=/app/data/excalidraw.db
    restart: unless-stopped
